name: Verify tech jobs deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/matching.ts'
      - 'lib/ingestion.ts'
      - 'app/api/**'
      - 'app/dashboard.tsx'
      - 'scripts/refresh_jobs.py'
      - 'scripts/verify-ingestion.mjs'
      - 'db/schema.sql'
      - 'components/resume-matcher.tsx'
      - 'scripts/verify-matching-deployment.py'
      - 'scripts/verify-security.mjs'
      - '.github/workflows/verify-matching.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    environment: EARTHWORK_UPDATER_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify atomic PostgreSQL ingestion
        run: node scripts/verify-ingestion.mjs
      - name: Verify updater authorization
        run: node scripts/verify-security.mjs
      - name: Verify deterministic matcher
        run: node scripts/verify-matching.mjs
      - name: Verify collector and discovery
        run: python scripts/verify_collector.py
      - name: Verify deployed tech jobs API and browser PDF asset
        env:
          SITE_ORIGIN: ${{ secrets.EARTHWORK_SITE_URL || 'https://earthwork-jobs.vercel.app' }}
          UPDATER_SECRET: ${{ secrets.EARTHWORK_UPDATER_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/verify-matching-deployment.py
