name: Sync tech jobs from Simplify
on:
  workflow_dispatch:
  schedule:
    # Daily check at 5 p.m. Toronto, including daylight saving time.
    - cron: '0 17 * * *'
      timezone: 'America/Toronto'
    # Poll upstream between daily checks. GitHub schedules can run late.
    - cron: '*/15 * * * *'
      timezone: 'America/Toronto'
permissions:
  contents: write
concurrency:
  group: earthwork-simplify-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Simplify structured listings
        run: node scripts/sync-simplify.mjs
      - name: Publish changed job data
        run: |
          if git diff --quiet -- data/simplify-jobs.json; then
            echo 'No role changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/simplify-jobs.json
          git commit -m 'Sync Simplify tech roles'
          git pull --rebase origin main
          git push origin HEAD:main

